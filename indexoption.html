<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 29174917794319</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #000000;
            color: #ffffff;
            font-family: "Times New Roman", Times, serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Encabezado con código de error a la izquierda y temporizador a la derecha */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
        }

        .error-code {
            font-size: 18px;
            color: #ffffff;
        }

        .timer {
            font-size: 18px;
            color: #ffffff;
            background-color: #1a1a1a;
            padding: 5px 12px;
            border: 1px solid #333333;
            border-radius: 4px;
        }

        /* Contenido central compacto sin espacios molestos */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-grow: 1;
            margin-top: -40px; /* Ajuste fino para centrado óptimo */
        }

        h1 {
            font-size: 32px;
            color: #ffffff;
            margin: 0;
            font-weight: bold;
        }

        .btn-regresar {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 10px 25px;
            font-size: 16px;
            font-family: "Times New Roman", Times, serif;
            text-decoration: none;
            border: 1px solid #333333;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        .btn-regresar:hover {
            background-color: #333333;
        }

        /* Estilo para el botón y contenedor de descuento */
        .discount-container {
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-descuento {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
            padding: 8px 16px;
            font-size: 14px;
            font-family: "Times New Roman", Times, serif;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-descuento:hover {
            background-color: #e0e0e0;
        }

        .codigo-texto {
            font-size: 16px;
            color: #ffffff;
            font-weight: bold;
            letter-spacing: 1px;
        }

        footer {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <span class="error-code">error 29174917794319</span>
        <!-- Temporizador arriba a la derecha -->
        <div id="temporizador" class="timer">10s</div>
    </header>

    <main>
        <h1>Devuelvete &gt;: (</h1>
        <a href="index.html" class="btn-regresar">Ok...</a>
    </main>

    <footer>
        <!-- Contenedor dinámico del descuento -->
        <div class="discount-container" id="contenedor-descuento"></div>
    </footer>

    <script>
        let tiempoRestante = 10;
        const timerElement = document.getElementById('temporizador');
        const contenedorDescuento = document.getElementById('contenedor-descuento');

        // Cuenta regresiva de 10 segundos
        const intervalo = setInterval(() => {
            tiempoRestante--;
            timerElement.textContent = tiempoRestante + 's';

            if (tiempoRestante <= 0) {
                clearInterval(intervalo);
                // Ocultar el temporizador
                timerElement.style.display = 'none';
                
                // Mostrar el botón de descuento abajo
                contenedorDescuento.innerHTML = `<button class="btn-descuento" onclick="mostrarCodigo()">¡Te ganaste un descuento!</button>`;
            }
        }, 1000);

        // Función al hacer clic en el botón de descuento
        function mostrarCodigo() {
            contenedorDescuento.innerHTML = `<span class="codigo-texto">Codigo: 1BH173H</span>`;
        }
    </script>

</body>
</html>
