<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 29174917794319</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #000000;
            color: #ffffff;
            font-family: "Times New Roman", Times, serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Encabezado */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
        }

        .error-code {
            font-size: 18px;
            color: #ffffff;
        }

        /* Contenedor del temporizador y botón en la esquina superior derecha */
        .top-right-container {
            min-width: 120px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        /* Temporizador estilo ROJO de peligro */
        .timer {
            font-size: 20px;
            color: #ffffff;
            background-color: #d32f2f;
            padding: 8px 16px;
            border: 1px solid #ff5252;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(211, 47, 47, 0.6);
        }

        /* Botón de descuento GRANDE y ROJO de peligro */
        .btn-descuento-grande {
            background-color: #d32f2f;
            color: #ffffff;
            border: 2px solid #ff5252;
            padding: 14px 28px;
            font-size: 20px;
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
        }

        .btn-descuento-grande:hover {
            background-color: #b71c1c;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.9);
        }

        /* Texto del código de descuento en rojo brillante */
        .codigo-texto-grande {
            font-size: 20px;
            color: #ffffff;
            font-weight: bold;
            background-color: #1a1a1a;
            padding: 12px 22px;
            border: 2px dashed #ff5252;
            border-radius: 6px;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 82, 82, 0.4);
        }

        /* Contenido central compacto */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-grow: 1;
            margin-top: -40px;
        }

        h1 {
            font-size: 32px;
            color: #ffffff;
            margin: 0;
            font-weight: bold;
        }

        .btn-regresar {
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 10px 25px;
            font-size: 16px;
            font-family: "Times New Roman", Times, serif;
            text-decoration: none;
            border: 1px solid #333333;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        .btn-regresar:hover {
            background-color: #333333;
        }

        footer {
            height: 40px;
        }
    </style>
</head>
<body>

    <header>
        <span class="error-code">error 29174917794319</span>
        
        <!-- Zona superior derecha para el temporizador y el botón -->
        <div class="top-right-container" id="zona-temporizador">
            <div id="temporizador" class="timer">10s</div>
        </div>
    </header>

    <main>
        <h1>Devuelvete &gt;: (</h1>
        <a href="index.html" class="btn-regresar">Ok...</a>
    </main>

    <footer></footer>

    <script>
        let tiempoRestante = 10;
        const timerElement = document.getElementById('temporizador');
        const zonaTemporizador = document.getElementById('zona-temporizador');

        const intervalo = setInterval(() => {
            tiempoRestante--;
            timerElement.textContent = tiempoRestante + 's';

            if (tiempoRestante <= 0) {
                clearInterval(intervalo);
                
                // Muestra el botón rojo de peligro en la misma esquina
                zonaTemporizador.innerHTML = `
                    <button class="btn-descuento-grande" onclick="mostrarCodigo()">¡Te ganaste un descuento!</button>
                `;
            }
        }, 1000);

        function mostrarCodigo() {
            // Muestra el código de descuento en el mismo lugar
            zonaTemporizador.innerHTML = `
                <span class="codigo-texto-grande">Codigo: 1BH173H</span>
            `;
        }
    </script>

</body>
</html>
