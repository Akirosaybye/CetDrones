<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - CetDrones</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: "Times New Roman", Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        header {
            width: 100%;
            padding: 20px 30px;
            box-sizing: border-box;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #000000;
            text-decoration: none;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            padding: 10px;
        }

        .foto-catalogo {
            max-width: 85vw;
            max-height: 62vh;
            object-fit: contain;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
        }

        .navegacion {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 10px;
        }

        @keyframes waveEntrance {
            0% {
                opacity: 0;
                transform: translateY(25px) scale(0.95);
            }
            60% {
                opacity: 1;
                transform: translateY(-5px) scale(1.02);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .btn-nav {
            padding: 12px 28px;
            font-size: 18px;
            font-family: "Times New Roman", Times, serif;
            text-decoration: none;
            border-radius: 6px;
            transition: transform 0.2s ease, opacity 0.2s ease;
            cursor: pointer;
            animation: waveEntrance 0.7s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            opacity: 0;
        }

        .btn-nav:nth-child(1) {
            animation-delay: 0.15s;
        }
        .btn-nav:nth-child(2) {
            animation-delay: 0.3s;
        }

        .btn-nav:hover {
            transform: scale(1.04);
        }

        /* Botón superior (Atrás / X): Fondo blanco, letra y borde negro */
        .btn-atras, .btn-cerrar {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            font-weight: bold;
        }

        .btn-atras:hover, .btn-cerrar:hover {
            background-color: #f2f2f2;
        }

        /* Botón inferior (Adelante / Comprar): Fondo negro, letra blanca, borde blanco */
        .btn-adelante, .btn-comprar {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            font-weight: bold;
        }

        .btn-adelante:hover, .btn-comprar:hover {
            background-color: #222222;
        }

        footer {
            height: 40px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">CetDrones</a>
    </header>

    <main>
        <img id="imagen-catalogo" src="" alt="Catálogo CetDrones" class="foto-catalogo">

        <div class="navegacion" id="botones-nav">
            <!-- Se inyectan dinámicamente -->
        </div>
    </main>

    <footer></footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let fotoActual = parseInt(urlParams.get('foto')) || 1;

        const minFoto = 1;
        const maxFoto = 7;

        if (fotoActual < minFoto) fotoActual = minFoto;
        if (fotoActual > maxFoto) fotoActual = maxFoto;

        // Carga la foto correspondiente en formato .png
        document.getElementById('imagen-catalogo').src = `${fotoActual}.png`;

        const contenedorBotones = document.getElementById('botones-nav');

        // 1. Botón izquierdo: Si está en la foto 1 muestra la "X", sino muestra "Atrás"
        if (fotoActual === minFoto) {
            contenedorBotones.innerHTML += `<a href="index.html" class="btn-nav btn-cerrar" title="Salir">✕</a>`;
        } else {
            contenedorBotones.innerHTML += `<a href="catalogo.html?foto=${fotoActual - 1}" class="btn-nav btn-atras">Atrás</a>`;
        }

        // 2. Botón derecho: Si es la última foto (7), muestra "¡Comprar!" hacia comprar.html. Si no, muestra "Adelante".
        if (fotoActual < maxFoto) {
            contenedorBotones.innerHTML += `<a href="catalogo.html?foto=${fotoActual + 1}" class="btn-nav btn-adelante">Adelante</a>`;
        } else {
            contenedorBotones.innerHTML += `<a href="comprar.html" class="btn-nav btn-comprar">¡Comprar!</a>`;
        }
    </script>

</body>
</html>
