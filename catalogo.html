<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - CetDrones</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: "Times New Roman", Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        header {
            width: 100%;
            padding: 20px 30px;
            box-sizing: border-box;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #000000;
            text-decoration: none;
        }

        /* Contenedor principal de la imagen y los controles */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 10px;
            position: relative;
        }

        /* Estilo para la foto del catálogo */
        .foto-catalogo {
            max-width: 85vw;
            max-height: 65vh;
            object-fit: contain;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }

        /* Contenedor de los botones de navegación */
        .navegacion {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 10px;
        }

        /* Estilo base para los botones (Cian BetaFPV sutil y semitransparente) */
        .btn-nav {
            background-color: rgba(0, 229, 255, 0.12); /* Cian transparente sutil */
            color: #005f73;
            padding: 10px 22px;
            font-size: 16px;
            font-family: "Times New Roman", Times, serif;
            text-decoration: none;
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 4px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-nav:hover {
            background-color: rgba(0, 229, 255, 0.25);
            border-color: rgba(0, 229, 255, 0.7);
        }

        /* Estilo específico para el botón "X" de cierre/salida */
        .btn-cerrar {
            font-weight: bold;
            padding: 10px 18px;
        }

        footer {
            height: 40px;
        }
    </style>
</head>
<body>

    <!-- Encabezado con el nombre de tu marca -->
    <header>
        <a href="index.html" class="logo">CetDrones</a>
    </header>

    <!-- Contenido dinámico -->
    <main>
        <!-- La imagen cambiará dinámicamente según el número -->
        <img id="imagen-catalogo" src="" alt="Catálogo CetDrones" class="foto-catalogo">

        <!-- Botones de navegación generados sin bugs -->
        <div class="navegacion" id="botones-nav">
            <!-- Se inyectan automáticamente desde JavaScript -->
        </div>
    </main>

    <footer></footer>

    <script>
        // Obtener el número de la foto actual desde la URL (ejemplo: catalogo.html?foto=1)
        const urlParams = new URLSearchParams(window.location.search);
        let fotoActual = parseInt(urlParams.get('foto')) || 1;

        // Definir los límites del catálogo (del 1 al 7)
        const minFoto = 1;
        const maxFoto = 7;

        // Validar por seguridad que no se salga de rango (evita bugs si manipulan la URL)
        if (fotoActual < minFoto) fotoActual = minFoto;
        if (fotoActual > maxFoto) fotoActual = maxFoto;

        // Asignar la imagen correspondiente (asumiendo formato .jpg, puedes cambiarlo a .png si tus fotos lo usan)
        // Nota: Si tus extensiones varían, puedes cambiar 'jpg' por la extensión exacta de tu repo.
        document.getElementById('imagen-catalogo').src = `${fotoActual}.jpg`;

        // Construir los botones de manera lógica y limpia
        const contenedorBotones = document.getElementById('botones-nav');

        // 1. Botón izquierdo: Si está en la foto 1 muestra la "X" (lleva a index), sino muestra "Atrás"
        if (fotoActual === minFoto) {
            contenedorBotones.innerHTML += `<a href="index.html" class="btn-nav btn-cerrar" title="Salir">✕</a>`;
        } else {
            contenedorBotones.innerHTML += `<a href="catalogo.html?foto=${fotoActual - 1}" class="btn-nav">Atrás</a>`;
        }

        // 2. Botón derecho: Si está en la última foto (7), desaparece por completo. Si no, muestra "Adelante".
        if (fotoActual < maxFoto) {
            contenedorBotones.innerHTML += `<a href="catalogo.html?foto=${fotoActual + 1}" class="btn-nav">Adelante</a>`;
        }
    </script>

</body>
</html>
