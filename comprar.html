<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar - CetDrones</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #000000;
            color: #ffffff;
            font-family: "Times New Roman", Times, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
        }

        .btn-volver {
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            border: 1px solid #333333;
            padding: 5px 12px;
            border-radius: 4px;
            background-color: #1a1a1a;
            transition: background-color 0.2s;
        }

        .btn-volver:hover {
            background-color: #333333;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
            max-width: 600px;
            margin-top: -20px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        input[type="text"] {
            padding: 10px 15px;
            font-size: 16px;
            font-family: "Times New Roman", Times, serif;
            background-color: #1a1a1a;
            color: #ffffff;
            border: 1px solid #444444;
            border-radius: 4px;
            outline: none;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            font-family: "Times New Roman", Times, serif;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #dcdcdc;
        }

        /* Sección del resultado oculta hasta poner el código correcto */
        .resultado {
            margin-top: 15px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .texto-premio {
            font-size: 18px;
            color: #ff5252;
            font-weight: bold;
        }

        .foto-premio {
            max-width: 80vw;
            max-height: 45vh;
            object-fit: contain;
            border: 1px solid #333333;
            border-radius: 4px;
        }

        footer {
            height: 40px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">CetDrones</a>
        <a href="catalogo.html?foto=7" class="btn-volver">← Volver al catálogo</a>
    </header>

    <main>
        <div>
            <h1>Ingresa el codigo de descuento</h1>
            <div class="input-group">
                <input type="text" id="codigoInput" placeholder="">
                <button onclick="verificarCodigo()">Canjear</button>
            </div>
        </div>

        <div id="resultadoSeccion" class="resultado">
            <p class="texto-premio" id="textoPremio"></p>
            <!-- Aquí cargará la imagen 8.png -->
            <img src="8.png" alt="Radio tostadora" class="foto-premio">
        </div>
    </main>

    <footer></footer>

    <script>
        function verificarCodigo() {
            const codigo = document.getElementById('codigoInput').value.trim();
            const resultado = document.getElementById('resultadoSeccion');
            const texto = document.getElementById('textoPremio');

            if (codigo === '1BH173H') {
                texto.innerHTML = "Te ganaste un 0.001% de descuento y una radio tostadora:";
                resultado.style.display = 'flex';
            } else {
                alert('Código incorrecto.');
            }
        }
    </script>

</body>
</html>
