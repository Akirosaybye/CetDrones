<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CetDrones</title>
    <style>
        /* Estilos generales y fuente Times New Roman */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #ffffff;
            font-family: "Times New Roman", Times, serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Encabezado: CetDrones arriba a la izquierda */
        header {
            padding: 20px 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #000000;
            text-decoration: none;
        }

        /* Contenedor central para los botones */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-grow: 1;
        }

        /* Botón principal "Catálogo" */
        .btn-catalogo {
            background-color: #f0f0f0; /* Fondo sutil para contraste con el blanco */
            color: #000000;
            padding: 15px 35px;
            font-size: 20px;
            font-family: "Times New Roman", Times, serif;
            text-decoration: none;
            border: 1px solid #dcdcdc;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        .btn-catalogo:hover {
            background-color: #e4e4e4;
        }

        /* Botón secundario "No quiero comprar :(" */
        .btn-no-comprar {
            background-color: #ffffff;
            color: #000000;
            padding: 8px 16px;
            font-size: 14px;
            font-family: "Times New Roman", Times, serif;
            text-decoration: none;
            border: 1px solid #cccccc;
            border-radius: 3px;
            transition: background-color 0.2s;
        }

        .btn-no-comprar:hover {
            background-color: #f8f8f8;
        }

        /* Espaciador inferior para mantener simetría */
        footer {
            height: 60px;
        }
    </style>
</head>
<body>

    <!-- Arriba a la izquierda -->
    <header>
        <span class="logo">CetDrones</span>
    </header>

    <!-- Contenido central -->
    <main>
        <!-- Botón que lleva a la primera foto del catálogo -->
        <a href="catalogo.html?foto=1" class="btn-catalogo">Catálogo</a>

        <!-- Botón que lleva a indexoption.html -->
        <a href="indexoption.html" class="btn-no-comprar">No quiero comprar :(</a>
    </main>

    <footer></footer>

</body>
</html>
